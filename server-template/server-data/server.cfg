# Settings come first, then resources in dependency order: everything a resource reads at start
# (convars, OneSync, permissions) is in place before the first ensure.

# ---- network ---------------------------------------------------------------------------------
# Only change the IP if the machine has several network interfaces; otherwise change the port only.
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ---- secrets ---------------------------------------------------------------------------------
# Database connection, Steam Web API key and the license key.
# Copy secrets.example.cfg to secrets.cfg and fill in your values. Never commit secrets.cfg.
exec secrets.cfg

# ---- server ----------------------------------------------------------------------------------
set sv_enforceGameBuild "3570"
set onesync on
sv_maxclients 8
sv_scriptHookAllowed 0

sv_hostname "My Development Server"
sets sv_projectName "My Server"
sets sv_projectDesc "Development server"
sets tags "default"
sets locale "en-US"
#load_server_icon myLogo.png     # 96x96 PNG in this folder
#sets banner_detail "https://url.to/image.png"
#sets banner_connecting "https://url.to/image.png"

# ---- permissions -----------------------------------------------------------------------------
add_ace group.admin command allow       # allow all commands
add_ace group.admin command.quit deny   # but don't allow quit
#add_principal identifier.fivem:1234567 group.admin   # make yourself admin (your FiveM ID)

# Lets static_backend run the profiler for Development Kit's resmon (nothing is typed into the console).
add_ace resource.static_backend command.profiler allow
add_ace resource.static_backend command.record allow
add_ace resource.static_backend command.saveJSON allow

# ---- resources (dependencies first) ----------------------------------------------------------
ensure static_backend        # first, so it sees every other resource start

# Default FiveM resources (shipped with the artifacts)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

# Your resources, by category
ensure [core]
ensure [maps]                # streamed assets before the scripts that use them
ensure [scripts]
